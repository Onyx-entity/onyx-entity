<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 288">
  <defs>

    <path id="sp" d="
      M0,0h1v1h-1z M1,0h1v1h-1z M2,0h1v1h-1z M3,0h1v1h-1z M0,1h1v1h-1z M1,1h1v1h-1z M0,2h1v1h-1z M0,3h1v1h-1z
      M-1,0h1v1h-1z M-2,0h1v1h-1z M-3,0h1v1h-1z M-4,0h1v1h-1z M-1,1h1v1h-1z M-2,1h1v1h-1z M-1,2h1v1h-1z M-1,3h1v1h-1z
      M0,-1h1v1h-1z M1,-1h1v1h-1z M2,-1h1v1h-1z M3,-1h1v1h-1z M0,-2h1v1h-1z M1,-2h1v1h-1z M0,-3h1v1h-1z M0,-4h1v1h-1z
      M-1,-1h1v1h-1z M-2,-1h1v1h-1z M-3,-1h1v1h-1z M-4,-1h1v1h-1z M-1,-2h1v1h-1z M-2,-2h1v1h-1z M-1,-3h1v1h-1z M-1,-4h1v1h-1z"/>
    <path id="sp-core" d="M-1,-1h2v2h-2z"/>
    <g id="star">
      <use href="#sp" transform="scale(2.4)" opacity="0.2"/>
      <use href="#sp"/>
      <use href="#sp-core" fill="#ffffff" opacity="0.55"/>
    </g>

    <linearGradient id="flameBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c1121f"/>
      <stop offset="0.6" stop-color="#ff7b00"/>
      <stop offset="1" stop-color="#7fd8ff"/>
    </linearGradient>
    <linearGradient id="flameFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9500"/>
      <stop offset="0.6" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#e8fbff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7b00" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0.6"/>
    </linearGradient>
    <path id="flame-tall" d="M0,0 V-16 H8 V-32 H16 V-48 H24 V-40 H32 V-56 H40 V-24 H48 V0 Z"/>
    <path id="flame-short" d="M0,0 V-8 H8 V-24 H16 V-40 H24 V-32 H32 V-48 H40 V-16 H48 V0 Z"/>
    <path id="flame-wisp" d="M0,0 V-16 H8 V-40 H16 V-24 H24 V0 Z"/>
    
    <style>
      .seg {
        transform-box: view-box;
      }

      .s1 { transform-origin: 73px 288px; }
      .s2 { transform-origin: 198px 288px; }
      .s3 { transform-origin: 321px 288px; }
      .s4 { transform-origin: 444px 288px; }

      .flame-back .s1 { animation: flicker-back 1.9s ease-in-out infinite; }
      .flame-back .s2 { animation: flicker-back 1.6s ease-in-out -0.6s infinite; }
      .flame-back .s3 { animation: flicker-back 2.1s ease-in-out -1.2s infinite; }
      .flame-back .s4 { animation: flicker-back 1.75s ease-in-out -0.3s infinite; }

      .flame-mid .s1 { animation: flicker-mid 1.2s ease-in-out -0.2s infinite; }
      .flame-mid .s2 { animation: flicker-mid 1.0s ease-in-out -0.5s infinite; }
      .flame-mid .s3 { animation: flicker-mid 1.3s ease-in-out -0.9s infinite; }
      .flame-mid .s4 { animation: flicker-mid 0.95s ease-in-out -0.4s infinite; }

      .flame-front .s1 { animation: flicker-front 0.9s ease-in-out infinite; }
      .flame-front .s2 { animation: flicker-front 0.7s ease-in-out -0.3s infinite; }
      .flame-front .s3 { animation: flicker-front 0.85s ease-in-out -0.6s infinite; }
      .flame-front .s4 { animation: flicker-front 0.75s ease-in-out -0.1s infinite; }

      @keyframes flicker-back {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(1.01, 1.04); }
      }

      @keyframes flicker-mid {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(1.02, 1.06); }
      }

      @keyframes flicker-front {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(1.02, 1.08); }
      }

      @media (prefers-reduced-motion: reduce) {
        .seg, .wisp {
          animation: none !important;
        }
      }
      .wisp-1 { animation: wisp 8.5s linear -2s infinite; }
      .wisp-2 { animation: wisp 11s linear -7s infinite; }
      .wisp-3 { animation: wisp 9.5s linear -4s infinite; }
      .wisp-4 { animation: wisp 13s linear -10s infinite; }

      .wisp {
        transform-box: view-box;
        opacity: 0;
      }

      @keyframes wisp {
        0% { opacity: 0; transform: translate(0, 0); }
        2% { opacity: 0.9; transform: translate(0, 0); }
        10% { opacity: 0; transform: translate(4px, -36px); }
        100% { opacity: 0; transform: translate(4px, -36px); }
      }

      .twinkle {
        transform-box: view-box;
        animation: twinkle 2.8s ease-in-out infinite;
      }

      @keyframes twinkle {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.4); opacity: 0.5; }
      }

    </style>
  </defs>

